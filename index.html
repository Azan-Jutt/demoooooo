
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To Do App</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>TaskFlow.</h1>
            <p>Manage your daily tasks easily!</p>
        </header>

        <div class="input-area">
            <input type="text" id="taskInput"
                   placeholder="Enter your task...">
            <button onclick="addTask()">Add Task</button>
        </div>

        <div class="stats">
            <div>
                <h2 id="total">0</h2>
                <p>Total Tasks</p>
            </div>

            <div>
                <h2 id="completed">0</h2>
                <p>Completed</p>
            </div>

            <div>
                <h2 id="remaining">0</h2>
                <p>Remaining</p>
            </div>
        </div>

        <h2 class="heading">My Tasks</h2>

        <ul id="taskList"></ul>

        <button class="clear-btn" onclick="clearTasks()">
            Clear All Tasks
        </button>

    </div>

    <script src="index.js"></script>
</body>
</html>
